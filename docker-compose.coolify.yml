# Coolify "Docker Compose" build pack: app + Postgres in one resource.
# SERVICE_* values are generated by Coolify; ${VAR:?} must be filled in the Environment Variables tab.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SERVICE_URL_APP_3000
      - PUBLIC_BASE_URL=${SERVICE_URL_APP}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/linecc
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-12h}
      # First admin, created only while the database has no users.
      - ADMIN_EMAIL=${ADMIN_EMAIL:?}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTO_ASSIGN=${AUTO_ASSIGN:-false}
      - QUEUE_POLL_MS=${QUEUE_POLL_MS:-500}
      - QUEUE_MAX_ATTEMPTS=${QUEUE_MAX_ATTEMPTS:-5}
      - QUEUE_BACKOFF_MS=${QUEUE_BACKOFF_MS:-2000}
    volumes:
      - uploads:/app/web/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=linecc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linecc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  uploads:
  pgdata:

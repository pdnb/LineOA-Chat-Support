<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ตั้งค่าเซิร์ฟเวอร์ — Hotline</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #d1d5db;
        --brand: #06c755;
        --brand-hover: #05b04b;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --card: #1f2937;
          --text: #f3f4f6;
          --muted: #9ca3af;
          --border: #374151;
          --danger: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 'Segoe UI', 'Leelawadee UI', Tahoma, sans-serif;
      }
      main {
        width: 100%;
        max-width: 400px;
        padding: 28px 24px;
        background: var(--card);
        border-radius: 12px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }
      header img {
        width: 32px;
        height: 32px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--brand);
        outline-offset: -1px;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 9px;
        border: 0;
        border-radius: 6px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-hover);
      }
      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      #error {
        min-height: 1.5em;
        margin: 10px 0 0;
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icon.png" alt="" />
        <h1>Hotline</h1>
      </header>
      <p>ใส่ URL ของเซิร์ฟเวอร์ Hotline ที่ใช้งาน (ขอได้จากผู้ดูแลระบบ)</p>
      <form id="form">
        <label for="url">Server URL</label>
        <input id="url" type="text" inputmode="url" placeholder="https://hotline.example.com" autocomplete="url" required />
        <button id="submit" type="submit">เชื่อมต่อ</button>
        <p id="error" role="alert"></p>
      </form>
    </main>
    <script>
      // Same call @tauri-apps/api's invoke() makes; avoids bundling the npm package for one page.
      const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
      const form = document.getElementById('form');
      const input = document.getElementById('url');
      const submit = document.getElementById('submit');
      const error = document.getElementById('error');

      invoke('get_server_url').then((url) => {
        input.value = url;
        input.select();
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submit.disabled = true;
        submit.textContent = 'กำลังตรวจสอบ…';
        error.textContent = '';
        try {
          await invoke('set_server_url', { url: input.value });
        } catch (err) {
          error.textContent = String(err);
          submit.disabled = false;
          submit.textContent = 'เชื่อมต่อ';
        }
      });
    </script>
  </body>
</html>

[package]
name = "hotline-desktop"
version = "0.2.0"
description = "Hotline desktop client"
edition = "2021"

[lib]
name = "hotline_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2.5"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-winrt-notification = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
